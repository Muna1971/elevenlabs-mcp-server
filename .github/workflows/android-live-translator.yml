name: Build Android live Arabic subtitles app

on:
  push:
    paths:
      - 'android-live-translator/**'
      - '.github/workflows/android-live-translator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-live-translator
    steps:
      - uses: actions/checkout@v4

      - name: Check model download links
        run: |
          base=$(python3 -c "import json;print(json.load(open('app/src/main/assets/bergamot_models.json'))['baseUrl'])")
          enar=$(python3 -c "import json;print(json.load(open('app/src/main/assets/bergamot_models.json'))['pairs']['en-ar']['model'])")
          for url in \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin \
            https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin \
            "$base/$enar"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I -L "$url")
            echo "$url -> $code"
            [ "$code" = "200" ]
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LiveArabicSubtitles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiveArabicSubtitles-apk
          path: android-live-translator/LiveArabicSubtitles.apk

      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: live-subtitles-apk
          name: تطبيق الترجمة الفورية (APK)
          prerelease: true
          files: android-live-translator/LiveArabicSubtitles.apk
          body: |
            حمّل ملف LiveArabicSubtitles.apk من الأسفل على هاتفك وثبّته.
            Download LiveArabicSubtitles.apk below on your Android phone and install it.
