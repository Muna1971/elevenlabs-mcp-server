plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.util.Properties

// Personal API keys are read from secrets.properties (git-ignored) and baked
// into BuildConfig. They are never committed to the repository.
def secrets = new Properties()
def secretsFile = rootProject.file("secrets.properties")
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}

android {
    namespace 'ai.muna.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "ai.muna.assistant"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"

        buildConfigField "String", "ANTHROPIC_KEY", "\"${secrets.getProperty('ANTHROPIC_KEY', '')}\""
        buildConfigField "String", "ELEVEN_KEY", "\"${secrets.getProperty('ELEVEN_KEY', '')}\""
        buildConfigField "String", "VOICE_ID", "\"${secrets.getProperty('VOICE_ID', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
